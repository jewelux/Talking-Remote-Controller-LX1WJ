; Placeholder profile with documented default CI-V address A4.
[profile]
version=1.0
name=Icom IC-705
voice_vendor=icom
voice_digits=705
variant=ic705

[connection]
civ_addr=0xA4
baud=9600
uart_num=1
rx_pin=18
tx_pin=17
