; Placeholder profile based on documented FT-891 CAT reference.
[profile]
version=1.0
name=Yaesu FT-891
voice_vendor=yaesu
voice_digits=891
variant=ft891

[connection]
baud=4800
uart_num=2
rx_pin=9
tx_pin=10
tx_invert=0
rx_invert=0

[protocol]
type=YAESU_FTDX_ASCII

[capabilities]
get_freq=1
set_freq=1
get_mode=1
set_mode=1
get_smeter=1
get_power=1
get_swr=1

[commands]
freq_get=FA;
freq_set_format=FA%09llu;
mode_get=MD;
mode_set_format=MD%s;
smeter_get=SM0;
power_get=RM5;
swr_get=RM6;

[responses]
freq_prefix=FA
mode_prefix=MD
smeter_prefix=SM0
power_prefix=RM5
swr_prefix=RM6

[modes]
lsb=1
usb=2
cw=3
fm=4
am=5
rtty=6
cwr=7
digi=8
rttyr=9
