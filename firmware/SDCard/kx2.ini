[profile]
version=1.0
name=Elecraft KX2
voice_vendor=elecraft
voice_digits=2

[connection]
baud=38400
uart_num=2
rx_pin=9
tx_pin=10
tx_invert=0
rx_invert=0

[protocol]
type=ELECRAFT_ASCII

[capabilities]
get_freq=1
set_freq=1
get_mode=1
set_mode=1
get_smeter=1
get_power=1
get_swr=1
get_nb=1
set_nb=1

[commands]
freq_get=FA;
freq_set_format=FA%011llu;
mode_get=MD;
mode_set_format=MD%s;
if_get=IF;
id_get=ID;
om_get=OM;
smeter_get=SM;
power_get=PO;
swr_get=SW;
nb_get=NB;
nb_on=NB1;
nb_off=NB0;
preamp_get=PA;
preamp_on=PA1;
preamp_off=PA0;
agc_get=GT;
agc_fast=GT002;
agc_slow=GT004;
power_state_get=PS;
power_state_on=PS1;
power_state_off=PS0;

[responses]
freq_prefix=FA
mode_prefix=MD
if_prefix=IF
id_prefix=ID
om_prefix=OM
smeter_prefix=SM
power_prefix=PO
swr_prefix=SW
nb_prefix=NB
preamp_prefix=PA
agc_prefix=GT
power_state_prefix=PS

[modes]
lsb=1
usb=2
cw=3
fm=4
am=5
rtty=
digi=6
cwr=7
rttyr=9
