; Yaesu FT-847. Own protocol: the FT-847 is not an FT-8x7 (0x80 is CAT OFF, not lock off).
; Cable: the FT-847 CAT jack is RS-232 level, use a null-modem (crossed) cable.
; CAT does not work while an FC-20 tuner is connected to the TUNER jack.
; Set the baud rate to match the radio's menu 37 (4800 / 9600 / 57600, default 4800).
[profile]
version=1.0
name=Yaesu FT-847
voice_vendor=yaesu
voice_digits=847

[connection]
baud=4800
uart_num=2
rx_pin=9
tx_pin=10
tx_invert=0
rx_invert=0

[protocol]
type=YAESU_FT847

[capabilities]
get_freq=1
set_freq=1
get_mode=1
set_mode=1
get_smeter=1
get_rxtx=1

[modes]
lsb=00
usb=01
cw=02
cwr=03
am=04
fm=08
