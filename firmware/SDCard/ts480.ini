[profile]
version=1.0
name=Kenwood TS-480
voice_vendor=kenwood
voice_digits=480

[connection]
baud=9600
uart_num=2
rx_pin=9
tx_pin=10
tx_invert=0
rx_invert=0

[protocol]
type=KENWOOD_ASCII

[capabilities]
get_freq=1
set_freq=1
get_mode=1
set_mode=1
get_smeter=1
get_power=0
get_swr=1
get_nr=1
set_nr=1
get_nb=1
set_nb=1

[commands]
freq_get=FA;
freq_set_format=FA%011llu;
mode_get=MD;
mode_set_format=MD%s;
smeter_get=SM0;
swr_get=RM1;
nr_get=NR;
nr_on=NR1;
nr_off=NR0;
nb_get=NB;
nb_on=NB1;
nb_off=NB0;

[responses]
freq_prefix=FA
mode_prefix=MD
smeter_prefix=SM0
swr_prefix=RM1
nr_prefix=NR
nb_prefix=NB

[modes]
lsb=1
usb=2
cw=3
fm=4
am=5
rtty=6
cwr=7
rttyr=8
digi=9
