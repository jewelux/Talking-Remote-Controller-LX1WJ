[profile]
version=1.0
name=Yaesu FTDX-101D
voice_vendor=yaesu
voice_digits=101

[connection]
baud=38400
uart_num=2
rx_pin=9
tx_pin=10
tx_invert=0
rx_invert=0

[protocol]
type=YAESU_FTDX_ASCII

[capabilities]
get_freq=1
set_freq=1
get_mode=1
set_mode=1
get_smeter=1
get_power=1
get_swr=1
get_nr=1
set_nr=1
get_nb=1
set_nb=1
get_notch=1
set_notch=1
get_lock=1
set_lock=1
get_tuner=1
set_tuner=1
start_tune=1

[commands]
freq_get=FA;
freq_set_format=FA%09llu;
mode_get=MD;
mode_set_format=MD%s;
smeter_get=SM0;
power_get=RM5;
swr_get=RM6;
nr_get=NR0;
nr_on=NR01;
nr_off=NR00;
nb_get=NB0;
nb_on=NB01;
nb_off=NB00;
notch_get=BP0;
notch_on=BP0001;
notch_off=BP0000;
preamp_get=PA0;
preamp_on=PA01;
preamp_off=PA00;
agc_get=GT0;
agc_fast=GT01;
agc_slow=GT03;
agc_off=GT00;
power_state_get=PS;
power_state_on=PS1;
power_state_off=PS0;
tuner_get=AC;
tuner_on=AC001;
tuner_off=AC000;
tune_start=AC002;
lock_get=LK;
lock_on=LK1;
lock_off=LK0;

[responses]
freq_prefix=FA
mode_prefix=MD
smeter_prefix=SM0
power_prefix=RM5
swr_prefix=RM6
nr_prefix=NR0
nb_prefix=NB0
notch_prefix=BP0
preamp_prefix=PA0
agc_prefix=GT0
power_state_prefix=PS
tuner_prefix=AC
lock_prefix=LK

[modes]
lsb=1
usb=2
cw=3
fm=4
am=5
rtty=6
cwr=7
digi=8
rttyr=9
