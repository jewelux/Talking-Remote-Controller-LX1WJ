; Icom IC-7760 profile based on the IC-7300 CI-V control path.
; MAIN/SUB direct addressing uses CI-V command 29 in the firmware.
[profile]
version=1.0
name=Icom IC-7760
voice_vendor=icom
voice_digits=7760
variant=ic7760

[connection]
civ_addr=0xB2
baud=19200
uart_num=1
rx_pin=18
tx_pin=17
tx_invert=1
rx_invert=0

[protocol]
type=CIV

[capabilities]
get_freq=1
set_freq=1
get_mode=1
set_mode=1
get_smeter=1
get_power=1
get_rf_power=1
set_rf_power=1
rf_power_max_watts=200
get_swr=1
get_rxtx=1
get_txfreq=1
get_nr=1
set_nr=1
get_nrlevel=1
set_nrlevel=1
get_nb=1
set_nb=1
get_nblevel=1
set_nblevel=1
get_notch=1
set_notch=1
get_notch_width=1
set_notch_width=1
get_pbt1=1
set_pbt1=1
get_pbt2=1
set_pbt2=1
get_filshape=1
set_filshape=1
get_filwidth=1
set_filwidth=1
get_lock=1
set_lock=1
get_monitor=1
set_monitor=1
get_monlevel=1
set_monlevel=1
get_transceive=1
set_transceive=1
get_tuner=1
set_tuner=1
start_tune=1
get_vfo=1
set_vfo=1
get_vfo_mode=1
set_vfo_mode=1
get_split=1
set_split=1
get_rit=1
set_rit=1
get_bstack=1
